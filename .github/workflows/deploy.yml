name: Deploy Office System

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    defaults:
      run:
        shell: cmd

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to Server
        run: |
          robocopy "%GITHUB_WORKSPACE%" "C:\Deployment\office-system" /MIR /XD .git .github node_modules .next
          if %ERRORLEVEL% LSS 8 exit /b 0
          exit /b %ERRORLEVEL%

      - name: Install Dependencies
        run: |
          cd /d C:\Deployment\office-system
          call npm install

      - name: Build Application
        run: |
          cd /d C:\Deployment\office-system
          call npm run build

      - name: Restart PM2
        run: |
          call pm2 restart office-system