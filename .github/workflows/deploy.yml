name: Deploy Office System

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Pull Latest Code
        shell: powershell
        run: |
          cd C:\Deployment\office-system
          git fetch origin
          git reset --hard origin/main

      - name: Restore Production Environment
        shell: powershell
        run: |
          Copy-Item `
            "C:\Deployment\config\office-system.env.local" `
            "C:\Deployment\office-system\.env.local" `
            -Force

      - name: Verify Production Environment
        shell: powershell
        run: |
          if (-not (Test-Path "C:\Deployment\office-system\.env.local")) {
            Write-Error "Production .env.local was not restored."
            exit 1
          }

          Write-Host "Production .env.local restored successfully."

      - name: Install Dependencies
        shell: powershell
        run: |
          cd C:\Deployment\office-system
          npm install

      - name: Build Application
        shell: powershell
        run: |
          cd C:\Deployment\office-system
          npm run build

      - name: Restart PM2
        shell: powershell
        run: |
          pm2 restart office-system --update-env