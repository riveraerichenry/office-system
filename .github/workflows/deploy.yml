
name: Deploy Office System

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Update production source code
      # Preserve the existing server .env.local file.
      # --------------------------------------------------
      - name: Pull Latest Code
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $projectPath = "C:\Deployment\office-system"
          $envFile = Join-Path $projectPath ".env.local"
          $backupFile = Join-Path $env:TEMP "office-system-production-env.local"

          if (-not (Test-Path -LiteralPath $projectPath -PathType Container)) {
            throw "Project directory does not exist: $projectPath"
          }

          if (-not (Test-Path -LiteralPath $envFile -PathType Leaf)) {
            throw "Production .env.local is missing. Deployment stopped to protect the server configuration."
          }

          Set-Location $projectPath

          # Save the exact existing server environment file outside
          # the repository before updating the source code.
          Copy-Item -LiteralPath $envFile -Destination $backupFile -Force

          try {
            git fetch origin main
            if ($LASTEXITCODE -ne 0) {
              throw "Git fetch failed."
            }

            git reset --hard origin/main
            if ($LASTEXITCODE -ne 0) {
              throw "Git reset failed."
            }
          }
          finally {
            # Restore the original server file even if Git fails.
            if (Test-Path -LiteralPath $backupFile -PathType Leaf) {
              Copy-Item -LiteralPath $backupFile -Destination $envFile -Force
              Remove-Item -LiteralPath $backupFile -Force
            }
          }

          if (-not (Test-Path -LiteralPath $envFile -PathType Leaf)) {
            throw "Production .env.local is missing after source update."
          }

          Write-Host "Source code updated."
          Write-Host "Existing server .env.local preserved."

      # --------------------------------------------------
      # 3. Verify production environment exists
      # Do not copy or modify it.
      # --------------------------------------------------
      - name: Verify Production Environment
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $projectPath = "C:\Deployment\office-system"
          $envFile = Join-Path $projectPath ".env.local"

          if (-not (Test-Path -LiteralPath $envFile -PathType Leaf)) {
            throw "Production .env.local is missing."
          }

          $file = Get-Item -LiteralPath $envFile

          if ($file.Length -eq 0) {
            throw "Production .env.local is empty. Deployment stopped."
          }

          Write-Host "Production .env.local exists and is non-empty."
          # Never print environment variables or secret values.

      # --------------------------------------------------
      # 4. Verify Node.js and npm
      # --------------------------------------------------
      - name: Verify Node and npm
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          node --version
          if ($LASTEXITCODE -ne 0) {
            throw "Node.js is unavailable."
          }

          npm --version
          if ($LASTEXITCODE -ne 0) {
            throw "npm is unavailable."
          }

      # --------------------------------------------------
      # 5. Stop PM2 before installing dependencies.
      # Helps release locked Windows SWC files.
      # --------------------------------------------------
      - name: Stop PM2 Before Deployment
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Set-Location "C:\Deployment\office-system"

          pm2 describe office-system
          $pm2ExitCode = $LASTEXITCODE

          if ($pm2ExitCode -eq 0) {
            pm2 stop office-system

            if ($LASTEXITCODE -ne 0) {
              throw "Could not stop office-system in PM2."
            }

            Write-Host "Office System stopped for deployment."
          }
          else {
            Write-Host "PM2 process is not registered or is unavailable. Continuing with dependency installation."
          }

      # --------------------------------------------------
      # 6. Install dependencies
      # --------------------------------------------------
      - name: Install Dependencies
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Set-Location "C:\Deployment\office-system"

          if (-not (Test-Path "package.json" -PathType Leaf)) {
            throw "package.json is missing."
          }

          if (Test-Path "package-lock.json" -PathType Leaf) {
            npm ci

            if ($LASTEXITCODE -ne 0) {
              throw "npm ci failed. Check the npm error output."
            }
          }
          else {
            npm install

            if ($LASTEXITCODE -ne 0) {
              throw "npm install failed. Check the npm error output."
            }
          }

          # Verify the Next.js executable exists after installation.
          if (-not (Test-Path ".\node_modules\.bin\next.cmd" -PathType Leaf)) {
            throw "Next.js executable is missing after dependency installation."
          }

          # Verify that the installed Next.js package can be resolved.
          node -e "console.log('Next.js version:', require('next/package.json').version)"

          if ($LASTEXITCODE -ne 0) {
            throw "Next.js package verification failed."
          }

          Write-Host "Dependencies installed and Next.js verified."

      # --------------------------------------------------
      # 7. Build the production application
      # --------------------------------------------------
      - name: Build Application
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Set-Location "C:\Deployment\office-system"

          # Verify the server environment is still present.
          if (-not (Test-Path ".env.local" -PathType Leaf)) {
            throw "Production .env.local is missing before build."
          }

          npm run build

          if ($LASTEXITCODE -ne 0) {
            throw "Next.js production build failed. PM2 restart skipped."
          }

          if (-not (Test-Path ".next\BUILD_ID" -PathType Leaf)) {
            throw "Build completed without the expected .next\BUILD_ID file."
          }

          Write-Host "Production build completed successfully."

      # --------------------------------------------------
      # 8. Restart PM2 only after a successful build
      # --------------------------------------------------
      - name: Restart PM2
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Set-Location "C:\Deployment\office-system"

          pm2 describe office-system

          if ($LASTEXITCODE -ne 0) {
            throw "PM2 process office-system is not registered. Register the application before deploying."
          }

          pm2 restart office-system --update-env

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to restart office-system."
          }

          pm2 status

          Write-Host "Office System restarted successfully."
