name: Deploy Office System

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Pull Latest Code
        run: |
          cd C:\Deployment\office-system
          git fetch origin
          git reset --hard origin/main

      - name: Install Dependencies
        run: |
          cd C:\Deployment\office-system
          npm install

      - name: Build Application
        run: |
          cd C:\Deployment\office-system
          npm run build

      - name: Restart PM2
        run: |
          pm2 restart office-system